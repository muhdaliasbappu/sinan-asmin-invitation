<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Dark test H</title><style>body{margin:0;background:#eee9e2;color:#4c5f76;font:17px/1.45 Georgia,serif}main{padding:20px 16px 40px;max-width:520px;margin:auto}h1{font-size:22px;margin:0 0 6px}.box{background:#e4dacd;border:1px solid #c9b9a3;padding:14px;margin:16px 0}.dark{background:#4c5f76;color:#eee9e2;padding:10px 14px}.photo{display:block;width:100%;height:120px;background:#d8c7ae url(../invitation-paper-texture.jpg) center/cover}a{color:#4c5f76}code{font-size:13px;word-break:break-all}canvas{display:block;width:100%;margin:16px 0}</style></head><body><main><h1>Variant H</h1><p>Drawn on a canvas (reference: should never be recoloured)</p><div class="box">Cream box, dark blue text. If this whole page looks cream (light) with dark blue writing, variant H works.</div><div class="dark">Dark blue strip with cream text.</div><span class="photo"></span><canvas id="cv" width="1000" height="360"></canvas><script>const c=document.getElementById("cv").getContext("2d");c.fillStyle="#eee9e2";c.fillRect(0,0,1000,360);c.fillStyle="#4c5f76";c.font="44px Georgia,serif";c.fillText("Canvas: cream with dark blue writing.",30,90);c.fillRect(30,150,940,120);c.fillStyle="#eee9e2";c.fillText("Dark blue strip with cream text.",60,225)</script><p>Other variants: <a href="a.html">A</a> · <a href="b.html">B</a> · <a href="c.html">C</a> · <a href="d.html">D</a> · <a href="e.html">E</a> · <a href="f.html">F</a> · <a href="g.html">G</a> · <a href="h.html">H</a></p><p><code id="ua"></code></p><script>document.getElementById("ua").textContent="Phone wants dark: "+matchMedia("(prefers-color-scheme: dark)").matches+" | "+navigator.userAgent</script></main></body></html>
